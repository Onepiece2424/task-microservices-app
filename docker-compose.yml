services:
  core-api:
    build:
      context: ./services/core-api
      target: development        # Dockerfile内のdevelopmentステージを使う
    ports:
      - "3000:3000"
    volumes:
      - ./services/core-api/src:/app/src   # ホットリロード用
      - core-api-node-modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://taskflow:taskflow@postgres:5432/taskflow
      - JWT_SECRET=dev-secret
      - SQS_ENDPOINT=http://localstack:4566
      - AWS_REGION=ap-northeast-1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskflow-net

  notification-service:
    build:
      context: ./services/notification-service
      target: development
    volumes:
      - ./services/notification-service/src:/app/src
      - notification-node-modules:/app/node_modules
    environment:
      - SQS_ENDPOINT=http://localstack:4566
      - SES_ENDPOINT=http://localstack:4566
      - AWS_REGION=ap-northeast-1
    depends_on:
      - localstack
    networks:
      - taskflow-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=taskflow
      - POSTGRES_PASSWORD=taskflow
      - POSTGRES_DB=taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=sqs,ses,s3
    ports:
      - "4566:4566"
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge

volumes:
  postgres-data:
  core-api-node-modules:
  notification-node-modules:
